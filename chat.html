<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PartnerLink - Notifications Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { 
            --wa-primary: #075e54; --wa-secondary: #128c7e; --wa-bg: #e5ddd5; 
            --wa-bubble-sent: #dcf8c6; --wa-bubble-received: #ffffff; --wa-gray: #f0f2f5;
            --fav-color: #ffca28; --unread-red: #ef4444;
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--wa-gray); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { background: var(--wa-primary); color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }

        /* ── BOUTON RETOUR ── */
        .back-btn {
            background: none; border: none; color: white;
            font-size: 1.2rem; cursor: pointer; padding: 0 10px 0 0;
            display: flex; align-items: center;
        }
        .header-left { display: flex; align-items: center; }
        
        .search-container { background: white; padding: 8px 12px; border-bottom: 1px solid #ddd; }
        .search-bar { background: var(--wa-gray); border-radius: 20px; display: flex; align-items: center; padding: 5px 15px; }
        .search-bar input { border: none; background: none; outline: none; flex: 1; padding: 5px; font-size: 0.95rem; }

        .tabs { display: flex; background: var(--wa-primary); color: rgba(255,255,255,0.7); font-weight: bold; text-transform: uppercase; font-size: 0.85rem; z-index: 10; }
        .tab { flex: 1; text-align: center; padding: 12px 0; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab.active { color: white; border-bottom: 3px solid white; }

        .main-container { flex: 1; overflow-y: auto; background: white; }
        .item-row { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #f2f2f2; cursor: pointer; }
        
        .avatar-container { position: relative; margin-right: 15px; }
        .avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; background: #eee; border: 1px solid #ddd; }
        
        .unread-badge { 
            position: absolute; top: -3px; right: -3px; 
            min-width: 20px; height: 20px;
            background: var(--unread-red); 
            border-radius: 10px;
            border: 2px solid white; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 800; color: white;
            padding: 0 4px; box-sizing: border-box; line-height: 1;
        }

        .item-info { flex: 1; min-width: 0; }
        .fav-star { color: var(--fav-color); font-size: 0.8rem; margin-left: 5px; }

        /* Chat Overlay */
        .chat-overlay { position: fixed; inset: 0; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png') var(--wa-bg); z-index: 2000; display: flex; flex-direction: column; }
        .chat-header { background: var(--wa-primary); color: white; padding: 10px; display: flex; align-items: center; gap: 10px; }
        .chat-header button { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .bubble { padding: 8px 12px; border-radius: 7px; max-width: 85%; font-size: 0.92rem; box-shadow: 0 1px 1px rgba(0,0,0,0.1); position: relative; }
        .sent { background: var(--wa-bubble-sent); align-self: flex-end; border-top-right-radius: 0; }
        .received { background: var(--wa-bubble-received); align-self: flex-start; border-top-left-radius: 0; }

        /* ── COCHES DE LECTURE ── */
        .msg-meta { display: flex; align-items: center; justify-content: flex-end; gap: 3px; font-size: 0.6rem; opacity: 0.6; margin-top: 4px; }
        .msg-meta.sent-meta { opacity: 1; }
        .ticks { font-size: 0.75rem; }
        .ticks.read { color: #53bdeb; }
        .ticks.delivered { color: #8a8a8a; }
        
        .input-area { padding: 8px; display: flex; align-items: center; gap: 8px; background: #f0f0f0; }
        .input-wrapper { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 12px; }
        .input-wrapper input { border: none; outline: none; flex: 1; padding: 8px; font-size: 1rem; }

        .btn-action { background: var(--wa-secondary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        
        /* Modales */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
        .modal-content input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin: 10px 0; box-sizing: border-box; font-size: 0.95rem; outline: none; }

        /* ── LISTE D'UTILISATEURS POUR AJOUT MEMBRE ── */
        .user-list { max-height: 250px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; margin: 10px 0; }
        .user-list-item { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5; transition: background 0.15s; }
        .user-list-item:hover { background: #f0f9f8; }
        .user-list-item input[type="checkbox"] { margin-right: 12px; width: 17px; height: 17px; accent-color: var(--wa-secondary); }
        .user-list-item img { width: 36px; height: 36px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 1px solid #ddd; }
        .user-list-item .uname { font-size: 0.9rem; font-weight: 600; color: #222; }
        .user-list-item .ucity { font-size: 0.75rem; color: #888; }

        .btn-primary { width: 100%; padding: 11px; background: var(--wa-secondary); color: white; border: none; border-radius: 8px; font-size: 0.97rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
        .btn-cancel { width: 100%; margin-top: 6px; background: none; border: none; color: #888; font-size: 0.9rem; cursor: pointer; }
        .btn-danger { width: 100%; padding: 11px; background: #e53935; color: white; border: none; border-radius: 8px; font-size: 0.97rem; font-weight: 600; cursor: pointer; margin-top: 8px; }

        .hidden { display: none !important; }

        /* ── MINUTEUR ENREGISTREMENT VOCAL ── */
        #recTimer {
            display: none;
            align-items: center;
            gap: 6px;
            color: #e53935;
            font-weight: 700;
            font-size: 0.92rem;
            white-space: nowrap;
        }
        #recTimer.active { display: flex; }
        #recDot {
            width: 9px; height: 9px;
            background: #e53935;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        /* ── PARAMÈTRES GROUPE ── */
        .group-photo-edit {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            gap: 8px;
        }
        .group-photo-edit img {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: cover; border: 3px solid var(--wa-secondary);
            cursor: pointer;
        }
        .group-photo-edit span {
            font-size: 0.8rem; color: var(--wa-secondary); cursor: pointer;
        }
        .section-title {
            font-size: 0.8rem; font-weight: 700; color: var(--wa-secondary);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin: 12px 0 6px;
        }
        .member-row {
            display: flex; align-items: center;
            padding: 8px 10px; border-bottom: 1px solid #f5f5f5;
            border-radius: 6px;
        }
        .member-row img {
            width: 36px; height: 36px; border-radius: 50%;
            object-fit: cover; border: 1px solid #ddd; margin-right: 10px;
        }
        .member-row .minfo { flex: 1; }
        .member-row .mname { font-size: 0.9rem; font-weight: 600; color: #222; }
        .member-row .mcity { font-size: 0.75rem; color: #888; }
        .btn-remove-member {
            background: #fdecea; border: none; color: #e53935;
            border-radius: 6px; padding: 5px 10px; font-size: 0.78rem;
            font-weight: 600; cursor: pointer;
        }
        .creator-badge {
            font-size: 0.7rem; background: var(--wa-secondary);
            color: white; border-radius: 4px; padding: 2px 6px; margin-left: 6px;
        }
        .divider { height: 1px; background: #eee; margin: 12px 0; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <button class="back-btn" onclick="window.location.href='index.html'" title="Retour">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h3 style="margin:0">PartnerLink</h3>
    </div>
    <i class="fas fa-plus-circle" onclick="openCreateGroup()" style="cursor:pointer"></i>
</header>

<div class="search-container">
    <div class="search-bar">
        <i class="fas fa-search" style="color:#888; margin-right:10px"></i>
        <input type="text" id="searchInput" placeholder="Rechercher par nom ou lieu..." oninput="loadData()">
    </div>
</div>

<div class="tabs">
    <div class="tab active" id="tab-chats" onclick="switchTab('chats')">Discussions</div>
    <div class="tab" id="tab-groups" onclick="switchTab('groups')">Groupes</div>
</div>

<main class="main-container" id="listContent"></main>

<!-- ── CHAT OVERLAY ── -->
<div id="chatOverlay" class="chat-overlay hidden">
    <div class="chat-header">
        <button onclick="closeChat()"><i class="fas fa-arrow-left"></i></button>
        <img id="chatHeaderImg" src="" class="avatar" style="width:38px; height:38px; margin:0">
        <div style="flex:1"><b id="chatHeaderName">...</b></div>
        <!-- ── BOUTON AJOUTER MEMBRE (visible uniquement au créateur du groupe) ── -->
        <i id="addMemberIcon" class="fas fa-user-plus hidden" onclick="openAddMember()" style="margin-right:15px; cursor:pointer; font-size:1.1rem;" title="Ajouter un membre"></i>
        <!-- ── BOUTON PARAMÈTRES GROUPE (visible uniquement au créateur du groupe) ── -->
        <i id="groupSettingsIcon" class="fas fa-cog hidden" onclick="openGroupSettings()" style="margin-right:15px; cursor:pointer; font-size:1.1rem;" title="Paramètres du groupe"></i>
        <i id="favBtn" class="far fa-star" onclick="toggleFavorite()" style="cursor:pointer"></i>
    </div>
    <div class="chat-messages" id="chatBox"></div>
    <div class="input-area">
        <div class="input-wrapper">
            <input id="msgInput" placeholder="Message" oninput="toggleInputIcons()">
            <label for="fileIn"><i class="fas fa-paperclip"></i></label>
            <input type="file" id="fileIn" class="hidden" onchange="uploadFile()">
            <i class="fas fa-map-marker-alt" onclick="sendLocation()" style="margin-left:8px; cursor:pointer; color:#888"></i>
        </div>
        <!-- ── MINUTEUR ROUGE ENREGISTREMENT ── -->
        <span id="recTimer"><span id="recDot"></span><span id="recTime">0:00</span></span>
        <button id="sendBtn" class="btn-action" onclick="sendMsg()"><i class="fas fa-microphone"></i></button>
    </div>
</div>

<!-- ── MODAL CRÉER GROUPE ── -->
<div id="groupModal" class="modal">
    <div class="modal-content">
        <h4 style="margin:0 0 5px">Nouveau Groupe</h4>
        <input type="text" id="newGroupName" placeholder="Nom du groupe...">
        <button class="btn-primary" onclick="saveNewGroup()">Créer</button>
        <button class="btn-cancel" onclick="closeModal('groupModal')">Annuler</button>
    </div>
</div>

<!-- ── MODAL AJOUTER MEMBRE AU GROUPE ── -->
<div id="addMemberModal" class="modal">
    <div class="modal-content">
        <h4 style="margin:0 0 8px"><i class="fas fa-user-plus" style="color:var(--wa-secondary)"></i> Ajouter des membres</h4>
        <input type="text" id="memberSearchInput" placeholder="Rechercher un utilisateur..." oninput="filterUserList()">
        <div class="user-list" id="userListContainer">
            <div style="text-align:center;padding:20px;color:#888">Chargement...</div>
        </div>
        <button class="btn-primary" onclick="confirmAddMembers()">Ajouter au groupe</button>
        <button class="btn-cancel" onclick="closeModal('addMemberModal')">Annuler</button>
    </div>
</div>

<!-- ── MODAL PARAMÈTRES DU GROUPE (créateur uniquement) ── -->
<div id="groupSettingsModal" class="modal">
    <div class="modal-content">
        <h4 style="margin:0 0 10px"><i class="fas fa-cog" style="color:var(--wa-secondary)"></i> Paramètres du groupe</h4>

        <!-- Photo du groupe -->
        <div class="group-photo-edit">
            <img id="settingsGroupPhoto" src="" alt="Photo groupe" onclick="document.getElementById('groupPhotoInput').click()">
            <span onclick="document.getElementById('groupPhotoInput').click()"><i class="fas fa-camera"></i> Changer la photo</span>
            <input type="file" id="groupPhotoInput" accept="image/*" class="hidden" onchange="uploadGroupPhoto()">
        </div>

        <div class="divider"></div>

        <!-- Membres actuels -->
        <div class="section-title"><i class="fas fa-users"></i> Membres du groupe</div>
        <div id="memberListContainer" style="border:1px solid #eee; border-radius:8px; overflow:hidden;">
            <div style="text-align:center;padding:16px;color:#888">Chargement...</div>
        </div>

        <div class="divider"></div>

        <!-- Supprimer le groupe -->
        <button class="btn-danger" onclick="confirmDeleteGroup()">
            <i class="fas fa-trash-alt"></i> Supprimer le groupe
        </button>
        <button class="btn-cancel" onclick="closeModal('groupSettingsModal')">Fermer</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, onSnapshot, where, updateDoc, doc, arrayUnion, arrayRemove, limit, orderBy, increment, getDocs, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDituhLJK7pxuRhM2Q72aYNVOG9IS748rY",
        authDomain: "partenerlink.firebaseapp.com",
        projectId: "partenerlink",
        storageBucket: "partenerlink.firebasestorage.app",
        messagingSenderId: "480670630648",
        appId: "1:480670630648:web:5faf421a9b8d915a68b10d",
        measurementId: "G-N915LT6SZH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(), db = getFirestore(), storage = getStorage();
    let me = null, currentMode = 'chats', activeId = null, unsub = null, mediaRecorder = null, audioChunks = [];
    let currentMembers = [];

    // ── Variables pour les coches de lecture ──
    let chatReadBy = {};
    let unsubChatDoc = null;
    let allUsersCache = [];
    let selectedUidsToAdd = [];

    // ── Nouvelles variables pour la gestion du groupe ──
    let isCreator = false;
    let currentGroupData = null;

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            onSnapshot(doc(db, "users", user.uid), async (snap) => {
                const userData = snap.data();
                const now = Date.now();
                const trenteUnJoursEnMS = 31 * 24 * 60 * 60 * 1000;

                if (userData.accountStatus === "active" && userData.activationDate) {
                    const tempsEcoule = now - userData.activationDate;
                    if (tempsEcoule > trenteUnJoursEnMS) {
                        await updateDoc(doc(db, "users", user.uid), { accountStatus: "disabled" });
                        return;
                    }
                }

                if(userData.accountStatus === "disabled") {
                    document.body.innerHTML = `
                        <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; font-family:sans-serif; background:#f8f9fa; color:#2c3e50;">
                            <i class="fas fa-calendar-times" style="font-size:60px; color:#e74c3c; margin-bottom:20px;"></i>
                            <h2>Abonnement Expiré</h2>
                            <p>Votre accès de 31 jours est terminé. Veuillez renouveler votre abonnement pour continuer à utiliser PartnerLink Pro.</p>
                            <button onclick="location.reload()" style="padding:10px 20px; background:#075e54; color:white; border:none; border-radius:5px; cursor:pointer;">J'ai payé mon réabonnement</button>
                        </div>
                    `;
                    return;
                }

                me = userData;
                loadData();
            });
        }
    });

    window.switchTab = (mode) => {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + mode).classList.add('active');
        loadData();
    };

    window.loadData = () => {
        if (!me) return;
        const coll = currentMode === 'chats' ? "users" : "groups";
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        onSnapshot(collection(db, coll), snap => {
            const list = document.getElementById('listContent');
            let items = [];
            
            snap.forEach(d => {
                const data = d.data();
                const id = currentMode === 'groups' ? d.id : (data.uid || d.id);
                if(currentMode === 'chats' && id === me.uid) return;
                if(currentMode === 'groups' && (!data.members || !data.members.includes(me.uid))) return;

                if((data.name||"").toLowerCase().includes(searchTerm) || (data.city||"").toLowerCase().includes(searchTerm)) {
                    const unreadCount = currentMode === 'chats'
                        ? (me.unreadCounts?.[id] || 0)
                        : (data.unreadCounts?.[me.uid] || 0);

                    items.push({ id, data, unreadCount });
                }
            });

            items.sort((a,b) => {
                const favA = a.data.favBy?.includes(me.uid) ? 1 : 0;
                const favB = b.data.favBy?.includes(me.uid) ? 1 : 0;
                if(favA !== favB) return favB - favA;
                return (b.data.lastMsgDate || 0) - (a.data.lastMsgDate || 0);
            });

            list.innerHTML = "";
            items.forEach(item => {
                const isFav = item.data.favBy?.includes(me.uid);
                const lieu = currentMode === 'chats' ? (item.data.city || 'Togo') : 'Groupe';
                const photo = item.data.photoURL || item.data.logo || `https://ui-avatars.com/api/?name=${item.data.name}&background=random`;
                const hasUnread = item.unreadCount > 0;
                const badgeLabel = item.unreadCount > 99 ? '99+' : item.unreadCount;
                
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <div class="avatar-container">
                        <img src="${photo}" class="avatar">
                        ${hasUnread ? `<div class="unread-badge">${badgeLabel}</div>` : ''}
                    </div>
                    <div class="item-info">
                        <div style="display:flex; justify-content:space-between">
                            <b style="${hasUnread ? 'font-weight:900' : ''}">${item.data.name} ${isFav ? '<i class="fas fa-star fav-star"></i>' : ''}</b>
                            <small style="color:${hasUnread ? 'var(--unread-red)' : '#999'}; font-size:0.7rem">${item.data.lastMsgDate ? formatChatDate(item.data.lastMsgDate) : ''}</small>
                        </div>
                        <small style="color:var(--wa-secondary)"><i class="fas fa-map-marker-alt"></i> ${lieu}</small>
                    </div>`;
                div.onclick = () => openChat(item.id, item.data);
                list.appendChild(div);
            });
        });
    };

    window.openChat = async (id, data) => {
        activeId = id;
        currentGroupData = data;
        document.getElementById('chatOverlay').classList.remove('hidden');
        document.getElementById('chatHeaderName').innerText = data.name;
        document.getElementById('chatHeaderImg').src = data.photoURL || data.logo || `https://ui-avatars.com/api/?name=${data.name}&background=random`;
        
        const isFav = data.favBy?.includes(me.uid);
        document.getElementById('favBtn').className = isFav ? 'fas fa-star' : 'far fa-star';
        document.getElementById('favBtn').style.color = isFav ? 'var(--fav-color)' : 'white';

        // ── Gestion des boutons créateur (groupes uniquement) ──
        const addIcon = document.getElementById('addMemberIcon');
        const settingsIcon = document.getElementById('groupSettingsIcon');

        if (currentMode === 'groups') {
            currentMembers = data.members || [];
            // Vérifier si l'utilisateur connecté est le créateur du groupe
            isCreator = data.createdBy === me.uid;

            if (isCreator) {
                addIcon.classList.remove('hidden');
                settingsIcon.classList.remove('hidden');
            } else {
                addIcon.classList.add('hidden');
                settingsIcon.classList.add('hidden');
            }
        } else {
            addIcon.classList.add('hidden');
            settingsIcon.classList.add('hidden');
            currentMembers = [];
            isCreator = false;
        }

        const coll = currentMode === 'chats' ? "users" : "groups";
        await updateDoc(doc(db, coll, id), { [`readBy.${me.uid}`]: Date.now() });

        if (currentMode === 'chats') {
            await updateDoc(doc(db, "users", me.uid), { [`unreadCounts.${id}`]: 0 });
        } else {
            await updateDoc(doc(db, "groups", id), { [`unreadCounts.${me.uid}`]: 0 });
        }

        // ── Écouter le document de la discussion pour les coches de lecture ──
        if (unsubChatDoc) unsubChatDoc();
        unsubChatDoc = onSnapshot(doc(db, coll, id), (snap) => {
            chatReadBy = snap.data()?.readBy || {};
            // Mettre à jour les données du groupe en temps réel
            if (currentMode === 'groups') {
                const freshData = snap.data();
                if (freshData) {
                    currentMembers = freshData.members || [];
                    currentGroupData = freshData;
                    // Mettre à jour la photo dans le header si changée
                    if (freshData.logo) {
                        document.getElementById('chatHeaderImg').src = freshData.logo;
                    }
                }
            }
        });

        const chatRef = currentMode === 'groups' ? id : [me.uid, id].sort().join("_");
        if(unsub) unsub();
        
        unsub = onSnapshot(query(collection(db, "messages"), where("chatId", "==", chatRef)), snap => {
            const box = document.getElementById('chatBox');
            let msgs = [];
            snap.forEach(m => msgs.push(m.data()));
            msgs.sort((a,b) => a.date - b.date);
            box.innerHTML = "";
            msgs.forEach(d => {
                const isMe = d.senderId === me.uid;
                const time = new Date(d.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let content = d.type==='text' ? `<span>${d.text}</span>` : d.type==='audio' ? `<audio src="${d.url}" controls style="width:200px"></audio>` : `<a href="${d.url}" target="_blank" style="color:inherit"><i class="fas fa-map-marked-alt"></i> Position GPS</a>`;
                if(d.type==='image') content = `<img src="${d.url}" style="max-width:100%; border-radius:8px">`;

                // ── COCHES DE LECTURE ──
                let ticksHtml = '';
                if (isMe) {
                    const isRead = getReadStatus(d.date);
                    ticksHtml = isRead
                        ? `<span class="ticks read">✓✓</span>`
                        : `<span class="ticks delivered">✓✓</span>`;
                }

                box.innerHTML += `
                    <div class="bubble ${isMe ? 'sent' : 'received'}">
                        ${content}
                        <div class="msg-meta ${isMe ? 'sent-meta' : ''}">
                            <span>${time}</span>
                            ${ticksHtml}
                        </div>
                    </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    };

    function getReadStatus(msgDate) {
        if (currentMode === 'chats') {
            const otherReadAt = chatReadBy[activeId];
            return otherReadAt && otherReadAt >= msgDate;
        } else {
            return currentMembers.some(uid => {
                if (uid === me.uid) return false;
                const readAt = chatReadBy[uid];
                return readAt && readAt >= msgDate;
            });
        }
    }

    window.sendMsg = async (val = null, type = 'text') => {
        const input = document.getElementById('msgInput');
        const text = val || input.value.trim();
        if(!text && type === 'text') { handleAudio(); return; }

        const now = Date.now();
        const chatRef = currentMode === 'groups' ? activeId : [me.uid, activeId].sort().join("_");
        
        await addDoc(collection(db, "messages"), { 
            chatId: chatRef, 
            senderId: me.uid, 
            text: type==='text' ? text : (type==='audio' ? '[Vocal]' : '[Fichier]'), 
            url: type!=='text' ? text : '', 
            type, 
            date: now 
        });
        
        if (currentMode === 'chats') {
            await updateDoc(doc(db, "users", activeId), { 
                lastMsgDate: now, 
                lastMsgSender: me.uid,
                [`unreadCounts.${me.uid}`]: increment(1)
            });
        } else {
            const groupUpdate = { lastMsgDate: now, lastMsgSender: me.uid };
            currentMembers.forEach(uid => {
                if (uid !== me.uid) groupUpdate[`unreadCounts.${uid}`] = increment(1);
            });
            await updateDoc(doc(db, "groups", activeId), groupUpdate);
        }

        input.value = "";
        toggleInputIcons();
    };

    let recInterval = null;

    async function handleAudio() {
        const btn = document.getElementById('sendBtn');
        const timerEl = document.getElementById('recTimer');
        const timeEl  = document.getElementById('recTime');

        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
                           : MediaRecorder.isTypeSupported('audio/webm')             ? 'audio/webm'
                           : MediaRecorder.isTypeSupported('audio/mp4')              ? 'audio/mp4'
                           : '';
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';

            mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                clearInterval(recInterval);
                timerEl.classList.remove('active');
                timeEl.textContent = '0:00';

                const blob = new Blob(audioChunks, { type: mimeType || 'audio/webm' });
                const sRef = ref(storage, `vocaux/${Date.now()}.${ext}`);
                await uploadBytes(sRef, blob);
                sendMsg(await getDownloadURL(sRef), 'audio');
            };
            mediaRecorder.start();
            btn.innerHTML = '<i class="fas fa-stop"></i>';

            let secs = 0;
            timerEl.classList.add('active');
            recInterval = setInterval(() => {
                secs++;
                const m = Math.floor(secs / 60);
                const s = String(secs % 60).padStart(2, '0');
                timeEl.textContent = `${m}:${s}`;
            }, 1000);

        } else {
            mediaRecorder.stop();
            btn.innerHTML = '<i class="fas fa-microphone"></i>';
        }
    }

    window.sendLocation = () => {
        navigator.geolocation.getCurrentPosition(pos => {
            const url = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            sendMsg(url, 'location');
        });
    };

    window.toggleFavorite = async () => {
        const coll = currentMode === 'chats' ? "users" : "groups";
        const isFav = document.getElementById('favBtn').classList.contains('fas');
        await updateDoc(doc(db, coll, activeId), { favBy: isFav ? arrayRemove(me.uid) : arrayUnion(me.uid) });
    };

    // ════════════════════════════════════════════════
    // ── AJOUT DE MEMBRES AU GROUPE ──
    // ════════════════════════════════════════════════

    window.openAddMember = async () => {
        selectedUidsToAdd = [];
        document.getElementById('memberSearchInput').value = '';
        document.getElementById('addMemberModal').style.display = 'flex';
        document.getElementById('userListContainer').innerHTML = '<div style="text-align:center;padding:20px;color:#888">Chargement...</div>';

        const snap = await getDocs(collection(db, "users"));
        allUsersCache = [];
        snap.forEach(d => {
            const u = d.data();
            const uid = u.uid || d.id;
            if (uid === me.uid) return;
            if (currentMembers.includes(uid)) return;
            allUsersCache.push({ uid, name: u.name || 'Utilisateur', city: u.city || '', photo: u.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name||'U')}&background=random` });
        });

        renderUserList(allUsersCache);
    };

    window.filterUserList = () => {
        const q = document.getElementById('memberSearchInput').value.toLowerCase();
        const filtered = allUsersCache.filter(u => u.name.toLowerCase().includes(q) || u.city.toLowerCase().includes(q));
        renderUserList(filtered);
    };

    function renderUserList(users) {
        const container = document.getElementById('userListContainer');
        if (users.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#888">Aucun utilisateur trouvé</div>';
            return;
        }
        container.innerHTML = users.map(u => `
            <div class="user-list-item" onclick="toggleUserCheck('${u.uid}')">
                <input type="checkbox" id="chk_${u.uid}" ${selectedUidsToAdd.includes(u.uid) ? 'checked' : ''} onclick="event.stopPropagation(); toggleUserCheck('${u.uid}')">
                <img src="${u.photo}" alt="${u.name}">
                <div>
                    <div class="uname">${u.name}</div>
                    ${u.city ? `<div class="ucity"><i class="fas fa-map-marker-alt"></i> ${u.city}</div>` : ''}
                </div>
            </div>
        `).join('');
    }

    window.toggleUserCheck = (uid) => {
        const idx = selectedUidsToAdd.indexOf(uid);
        if (idx === -1) selectedUidsToAdd.push(uid);
        else selectedUidsToAdd.splice(idx, 1);
        const chk = document.getElementById('chk_' + uid);
        if (chk) chk.checked = selectedUidsToAdd.includes(uid);
    };

    window.confirmAddMembers = async () => {
        if (selectedUidsToAdd.length === 0) {
            alert('Veuillez sélectionner au moins un utilisateur.');
            return;
        }
        const newMembers = [...currentMembers, ...selectedUidsToAdd];
        await updateDoc(doc(db, "groups", activeId), { members: newMembers });
        currentMembers = newMembers;
        closeModal('addMemberModal');
        alert(`${selectedUidsToAdd.length} membre(s) ajouté(s) avec succès !`);
        selectedUidsToAdd = [];
    };

    // ════════════════════════════════════════════════
    // ── PARAMÈTRES DU GROUPE (créateur uniquement) ──
    // ════════════════════════════════════════════════

    window.openGroupSettings = async () => {
        if (!isCreator) return;

        // Photo du groupe
        const photoSrc = currentGroupData?.logo || currentGroupData?.photoURL ||
            `https://ui-avatars.com/api/?name=${encodeURIComponent(currentGroupData?.name || 'G')}&background=random`;
        document.getElementById('settingsGroupPhoto').src = photoSrc;

        document.getElementById('groupSettingsModal').style.display = 'flex';
        await renderMemberList();
    };

    // Afficher la liste des membres avec boutons de retrait
    async function renderMemberList() {
        const container = document.getElementById('memberListContainer');
        container.innerHTML = '<div style="text-align:center;padding:16px;color:#888">Chargement des membres...</div>';

        const memberDetails = [];
        for (const uid of currentMembers) {
            try {
                const snap = await getDoc(doc(db, "users", uid));
                if (snap.exists()) {
                    const u = snap.data();
                    memberDetails.push({
                        uid,
                        name: u.name || 'Utilisateur',
                        city: u.city || '',
                        photo: u.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name||'U')}&background=random`
                    });
                }
            } catch(e) {
                // ignorer les erreurs de chargement individuel
            }
        }

        if (memberDetails.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:16px;color:#888">Aucun membre trouvé</div>';
            return;
        }

        container.innerHTML = memberDetails.map(u => {
            const isMe = u.uid === me.uid;
            const isGroupCreator = u.uid === currentGroupData?.createdBy;
            return `
                <div class="member-row">
                    <img src="${u.photo}" alt="${u.name}">
                    <div class="minfo">
                        <div class="mname">
                            ${u.name}
                            ${isGroupCreator ? '<span class="creator-badge">Créateur</span>' : ''}
                            ${isMe && !isGroupCreator ? '<span style="font-size:0.7rem;color:#888;margin-left:4px">(moi)</span>' : ''}
                        </div>
                        ${u.city ? `<div class="mcity"><i class="fas fa-map-marker-alt"></i> ${u.city}</div>` : ''}
                    </div>
                    ${(!isGroupCreator) ? `<button class="btn-remove-member" onclick="removeMember('${u.uid}', '${u.name}')"><i class="fas fa-user-minus"></i> Retirer</button>` : ''}
                </div>
            `;
        }).join('');
    }

    // Retirer un membre du groupe
    window.removeMember = async (uid, name) => {
        if (!isCreator) return;
        if (!confirm(`Retirer "${name}" du groupe ?`)) return;

        const newMembers = currentMembers.filter(m => m !== uid);
        await updateDoc(doc(db, "groups", activeId), { members: newMembers });
        currentMembers = newMembers;
        // Rafraîchir la liste dans le modal
        await renderMemberList();
    };

    // Changer la photo du groupe
    window.uploadGroupPhoto = async () => {
        if (!isCreator) return;
        const file = document.getElementById('groupPhotoInput').files[0];
        if (!file) return;

        const photoEl = document.getElementById('settingsGroupPhoto');
        photoEl.style.opacity = '0.5';

        try {
            const sRef = ref(storage, `groups/${activeId}/logo_${Date.now()}`);
            await uploadBytes(sRef, file);
            const url = await getDownloadURL(sRef);

            await updateDoc(doc(db, "groups", activeId), { logo: url });

            // Mettre à jour visuellement
            photoEl.src = url;
            document.getElementById('chatHeaderImg').src = url;
            photoEl.style.opacity = '1';
        } catch(e) {
            photoEl.style.opacity = '1';
            alert('Erreur lors du changement de photo. Veuillez réessayer.');
        }
    };

    // Supprimer le groupe
    window.confirmDeleteGroup = async () => {
        if (!isCreator) return;
        if (!confirm(`Supprimer définitivement le groupe "${currentGroupData?.name}" ? Cette action est irréversible.`)) return;

        try {
            await deleteDoc(doc(db, "groups", activeId));
            closeModal('groupSettingsModal');
            closeChat();
            alert('Le groupe a été supprimé.');
        } catch(e) {
            alert('Erreur lors de la suppression. Veuillez réessayer.');
        }
    };

    // ════════════════════════════════════════════════

    window.formatChatDate = (t) => {
        const d = new Date(t);
        return d.toDateString() === new Date().toDateString()
            ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            : d.toLocaleDateString([], {day:'2-digit', month:'2-digit'});
    };

    window.closeChat = () => {
        document.getElementById('chatOverlay').classList.add('hidden');
        if (unsubChatDoc) { unsubChatDoc(); unsubChatDoc = null; }
        chatReadBy = {};
        isCreator = false;
        currentGroupData = null;
    };

    window.openCreateGroup = () => document.getElementById('groupModal').style.display = 'flex';
    window.closeModal = id => document.getElementById(id).style.display = 'none';

    // ── Enregistrement du créateur lors de la création du groupe ──
    window.saveNewGroup = async () => {
        const name = document.getElementById('newGroupName').value;
        if(!name) return;
        await addDoc(collection(db, "groups"), {
            name,
            members: [me.uid],
            createdBy: me.uid,         // ← champ créateur ajouté
            lastMsgDate: Date.now(),
            favBy: []
        });
        closeModal('groupModal');
        document.getElementById('newGroupName').value = '';
    };

    window.uploadFile = async () => {
        const file = document.getElementById('fileIn').files[0];
        if(!file) return;
        const sRef = ref(storage, `chats/${Date.now()}`);
        await uploadBytes(sRef, file);
        sendMsg(await getDownloadURL(sRef), 'image');
    };

    window.toggleInputIcons = () => {
        const val = document.getElementById('msgInput').value.trim();
        document.getElementById('sendBtn').innerHTML = val ? '<i class="fas fa-paper-plane"></i>' : '<i class="fas fa-microphone"></i>';
    };
</script>
</body>
</html>
