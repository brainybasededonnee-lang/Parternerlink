<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAINY - Admin Panel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --admin-dark: #1a252f; --admin-blue: #3498db; --danger: #e74c3c; --success: #2ecc71; --warning: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f0f2f5; color: #333; }
        
        /* AUTHENTIFICATION */
        .admin-auth { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--admin-dark); }
        .auth-card { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .auth-card h2 { margin-bottom: 25px; color: var(--admin-dark); }
        .auth-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        /* DASHBOARD */
        header { background: var(--admin-dark); color: white; padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .container { padding: 30px 5%; max-width: 1200px; margin: auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--admin-blue); }
        .stat-card h2 { margin: 10px 0 0 0; font-size: 2rem; }

        /* TABLEAU */
        .table-container { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #f8f9fa; font-weight: 600; color: #666; text-transform: uppercase; font-size: 0.8rem; }
        
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #eee; }
        
        /* BOUTONS & BADGES */
        .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; font-size: 0.85rem; }
        .btn-deactivate { background: var(--danger); }
        .btn-activate { background: var(--success); }
        .btn-deactivate:hover { background: #c0392b; }
        .btn-activate:hover { background: #27ae60; }
        
        .status-badge { padding: 5px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .status-active { background: #e8f5e9; color: var(--success); }
        .status-disabled { background: #ffebee; color: var(--danger); }
        
        .days-left { font-size: 0.8rem; font-weight: bold; }
        .days-ok { color: var(--success); }
        .days-low { color: var(--warning); }
        .days-expired { color: var(--danger); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="adminLogin" class="admin-auth">
    <div class="auth-card">
        <i class="fas fa-user-shield" style="font-size: 3rem; color: var(--admin-blue); margin-bottom: 15px;"></i>
        <h2>BRAINY ADMIN</h2>
        <input type="text" id="adminUser" placeholder="Nom Admin">
        <input type="password" id="adminPass" placeholder="Mot de passe">
        <button onclick="checkAdmin()" class="btn" style="background:var(--admin-blue); width:100%; margin-top:10px; padding:15px">SE CONNECTER</button>
    </div>
</div>

<div id="adminDash" class="hidden">
    <header>
        <div>
            <h2 style="margin:0; font-size:1.2rem;">BRAINY AGENCY</h2>
            <small style="opacity:0.7">Gestion des abonnements PartnerLink</small>
        </div>
        <button onclick="location.reload()" class="btn" style="background:rgba(255,255,255,0.1)"><i class="fas fa-sign-out-alt"></i> Quitter</button>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <small>Utilisateurs Total</small>
                <h2 id="countTotal">0</h2>
            </div>
            <div class="stat-card" style="border-left-color: var(--success);">
                <small>Comptes Actifs</small>
                <h2 id="countActive">0</h2>
            </div>
            <div class="stat-card" style="border-left-color: var(--danger);">
                <small>Comptes Bloqués</small>
                <h2 id="countDisabled">0</h2>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Ville / WhatsApp</th>
                        <th>Abonnement</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

   const firebaseConfig = {
    apiKey: "AIzaSyDituhLJK7pxuRhM2Q72aYNVOG9IS748rY",
    authDomain: "partenerlink.firebaseapp.com",
    projectId: "partenerlink",
    storageBucket: "partenerlink.firebasestorage.app",
    messagingSenderId: "480670630648",
    appId: "1:480670630648:web:5faf421a9b8d915a68b10d",
    measurementId: "G-N915LT6SZH"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore();

    // Vérification de sécurité BRAINY
    window.checkAdmin = () => {
        const user = document.getElementById('adminUser').value;
        const pass = document.getElementById('adminPass').value;
        
        if(user === "BRAINY" && pass === "963689") {
            document.getElementById('adminLogin').classList.add('hidden');
            document.getElementById('adminDash').classList.remove('hidden');
            loadDatabase();
        } else {
            alert("Identifiants incorrects !");
        }
    };

    function loadDatabase() {
        onSnapshot(collection(db, "users"), (snap) => {
            const body = document.getElementById('userTableBody');
            let total = 0, actifs = 0, bloques = 0;
            body.innerHTML = "";

            snap.forEach(u => {
                const data = u.data();
                const id = u.id;
                const status = data.accountStatus || "active";
                const isActive = status === "active";
                
                total++;
                if(isActive) actifs++; else bloques++;

                // Calcul des jours restants
                let subscriptionText = "Non activé";
                let daysClass = "days-expired";
                
                if (data.activationDate) {
                    const diff = (data.activationDate + (31 * 24 * 60 * 60 * 1000)) - Date.now();
                    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                    
                    if (days > 0) {
                        subscriptionText = `${days} jours restants`;
                        daysClass = days > 5 ? "days-ok" : "days-low";
                    } else {
                        subscriptionText = "Expiré";
                        daysClass = "days-expired";
                    }
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="user-info">
                            <img src="${data.logo || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png'}" class="user-img">
                            <div>
                                <div style="font-weight:bold">${data.name || 'Sans nom'}</div>
                                <div style="font-size:0.75rem; color:#888">${data.email}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div style="font-size:0.85rem">📍 ${data.city || '-'}</div>
                        <div style="font-size:0.85rem">📞 ${data.whatsapp || '-'}</div>
                    </td>
                    <td>
                        <span class="days-left ${daysClass}">${subscriptionText}</span>
                    </td>
                    <td>
                        <span class="status-badge ${isActive ? 'status-active' : 'status-disabled'}">
                            ${isActive ? 'ACTIF' : 'BLOQUÉ'}
                        </span>
                    </td>
                    <td>
                        <button onclick="manageUser('${id}', '${status}')" class="btn ${isActive ? 'btn-deactivate' : 'btn-activate'}">
                            ${isActive ? '<i class="fas fa-user-slash"></i> Désactiver' : '<i class="fas fa-user-check"></i> Activer (31j)'}
                        </button>
                    </td>
                `;
                body.appendChild(tr);
            });

            document.getElementById('countTotal').innerText = total;
            document.getElementById('countActive').innerText = actifs;
            document.getElementById('countDisabled').innerText = bloques;
        });
    }

    // Fonction pour Activer (31j) ou Désactiver
    window.manageUser = async (uid, currentStatus) => {
        const willActivate = currentStatus !== "active";
        const msg = willActivate ? "Activer ce compte pour une durée de 31 jours ?" : "Voulez-vous vraiment bloquer ce compte ?";
        
        if(confirm(msg)) {
            const updateData = {
                accountStatus: willActivate ? "active" : "disabled"
            };

            // Si on active, on définit la date de départ à NOW
            if(willActivate) {
                updateData.activationDate = Date.now();
            }

            await updateDoc(doc(db, "users", uid), updateData);
        }
    };
</script>
</body>
</html>
